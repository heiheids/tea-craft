# 茶工艺 · 26.3 NeoForge 版（第四支独立工程）
#
# 版本坐标全部来自「本机已缓存」（离线构建）：
#   NeoForge 26.3.0.67-beta : 缓存里有 userdev / sources / universal / pom / module
#   NeoForm 26.3-1          : 缓存里有（MC 26.3 的 patched 产物链）
#   ModDevGradle 2.0.148    : 缓存里有插件 marker
#   JDK 25                  : mcmod/tools/jdk25（26.3 需要 Java 25）
#
# ⚠ 目标实例跑的是 NeoForge **26.3.0.86**，而离线缓存只有 **26.3.0.67-beta** 的编译件。
#   所以按 0.67-beta 编译；mods.toml 里的 neoforge 依赖写成下界 [26.3.0.67-beta,)，
#   0.86 满足它。beta 线两次构建之间有 API 漂移的风险 —— 装好后必须在实例里实测。
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.parallel=true

